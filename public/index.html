<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartMart POS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span>🛒</span><div><b>SmartMart</b><small>POS</small></div></div>
    <button class="nav active" data-page="billing">🧾 Billing</button>
    <button class="nav" data-page="products">📦 Products</button>
    <button class="nav" data-page="sales">📊 Sales</button>
    <button class="nav" data-page="dashboard">🏠 Dashboard</button>
    <div class="side-bottom"><span>Cashier</span><b>Admin</b></div>
  </aside>

  <main class="main">
    <header>
      <div><h1 id="pageTitle">Billing</h1><p id="clock"></p></div>
      <div class="header-actions"><span class="status">● Local POS</span></div>
    </header>

    <section id="billing" class="page active">
      <div class="billing-grid">
        <div class="panel">
          <div class="scan-row">
            <input id="barcode" placeholder="Scan or enter barcode..." autofocus>
            <button class="primary" id="scanBtn">ADD</button>
          </div>
          <div class="search-row"><input id="billSearch" placeholder="Search product by name, barcode or SKU..."></div>
          <div id="suggestions" class="suggestions"></div>
          <div class="table-wrap">
            <table><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>GST</th><th>Total</th><th></th></tr></thead>
            <tbody id="cartBody"></tbody></table>
          </div>
        </div>
        <div class="panel bill-panel">
          <h2>Bill Summary</h2>
          <div class="summary"><span>Subtotal</span><b id="subtotal">₹0.00</b></div>
          <div class="summary"><span>Discount</span><input id="discount" type="number" min="0" value="0"></div>
          <div class="summary"><span>GST</span><b id="gst">₹0.00</b></div>
          <hr>
          <div class="grand"><span>Total</span><b id="grandTotal">₹0.00</b></div>
          <h3>Payment</h3>
          <div class="payments">
            <button class="pay active" data-pay="Cash">💵 Cash</button>
            <button class="pay" data-pay="UPI">📱 UPI</button>
            <button class="pay" data-pay="Card">💳 Card</button>
          </div>
          <button class="checkout" id="checkout">GENERATE BILL</button>
          <button class="clear" id="clearCart">Clear Bill</button>
        </div>
      </div>
    </section>

    <section id="products" class="page">
      <div class="toolbar"><input id="productSearch" placeholder="Search products..."><button class="primary" id="newProduct">+ Add Product</button></div>
      <div class="panel table-wrap"><table><thead><tr><th>Name</th><th>Barcode</th><th>Category</th><th>Price</th><th>GST</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="productBody"></tbody></table></div>
    </section>

    <section id="sales" class="page">
      <div class="panel table-wrap"><table><thead><tr><th>Bill</th><th>Date</th><th>Subtotal</th><th>Discount</th><th>GST</th><th>Total</th><th>Payment</th></tr></thead><tbody id="salesBody"></tbody></table></div>
    </section>

    <section id="dashboard" class="page">
      <div class="cards">
        <div class="card"><span>Products</span><b id="dProducts">0</b></div>
        <div class="card"><span>Total Stock</span><b id="dStock">0</b></div>
        <div class="card"><span>Bills</span><b id="dSales">0</b></div>
        <div class="card"><span>Revenue</span><b id="dRevenue">₹0</b></div>
        <div class="card warn"><span>Low Stock</span><b id="dLow">0</b></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h2>Add Product</h2><button id="closeModal">×</button></div>
    <form id="productForm">
      <input name="name" placeholder="Product name" required>
      <input name="barcode" placeholder="Barcode">
      <input name="sku" placeholder="SKU">
      <div class="two"><input name="price" type="number" step="0.01" placeholder="Price" required><input name="gst" type="number" step="0.01" placeholder="GST %"></div>
      <div class="two"><input name="stock" type="number" placeholder="Opening stock"><input name="category" placeholder="Category"></div>
      <button class="primary wide">Save Product</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
